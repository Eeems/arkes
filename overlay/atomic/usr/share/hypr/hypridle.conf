general {
    lock_cmd = run-parts /usr/lib/system/lock.d && sleep 5
    unlock_cmd = loginctl unlock-session
    before_sleep_cmd = run-parts /usr/lib/system/suspend.d && sleep 5
    after_sleep_cmd = run-parts /usr/lib/system/resume.d
    inhibit_sleep = 3
}
listener {
    timeout = 150
    on-timeout = brightnessctl -s set $(($(brightnessctl get) / 2))
    on-resume = brightnessctl -r
}
listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
listener {
    timeout = 330
    on-timeout = os display off
    on-resume = os display on
}
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
