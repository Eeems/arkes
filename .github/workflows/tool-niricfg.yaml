name: Build builder image
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to quay.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io

      - uses: ./.github/actions/mask-registry-passwords

      - name: Generate tags
        id: meta
        run: |
          pip install pyxattr progressbar2
          IMAGE_NAME=quay.io/eeems/arkes-builder
          HASH="$(python ./make/hash-niricfg.py --no-newline)"
          echo "tags=${IMAGE_NAME}:niricfg,${IMAGE_NAME}:${HASH}" >> "$GITHUB_OUTPUT"
          echo "missing=$(skopeo list-tags docker://$IMAGE_NAME | jq --arg hash "$HASH" 'any(.Tags[]; . == $hash) | not')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Build and push
        if: fromJson(steps.meta.outputs.missing)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/niricfg/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
